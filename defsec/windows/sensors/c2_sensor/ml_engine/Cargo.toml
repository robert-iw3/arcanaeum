[package]
name = "c2sensor_ml"
version = "1.0.1"
edition = "2024"
authors = ["Robert Weber"]

[lib]
name = "c2sensor_ml"
crate-type = ["cdylib"]

[dependencies]
# --- Gateway Routing Dependencies ---
tokio = { version = "1", features = ["full"] }
transmission = { path = "../transmission" }
# Pinned to match transmission: arrow 50 is incompatible with chrono's newer
# Datelike::quarter (E0034 in arrow-arith). See transmission/Cargo.toml.
chrono = "=0.4.31"

# --- Core ML & Parsing ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
linfa = "0.7"
linfa-clustering = "0.7"
linfa-nn = "0.7"
ndarray = "0.15"
rand = "0.8"
regex = "1.10"
gethostname = "0.4"
uuid = { version = "1", features = ["v4"] }