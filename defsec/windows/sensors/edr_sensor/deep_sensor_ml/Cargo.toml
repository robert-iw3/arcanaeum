[package]
name = "deep_sensor_ml"
version = "0.2.1"
edition = "2024"
authors = ["Robert Weber"]

[lib]
name = "deep_sensor_ml"
crate-type = ["cdylib"]

[dependencies]
# --- Gateway Routing Dependencies ---
tokio = { version = "1", features = ["full"] }
transmission = { path = "../transmission" }

# --- Core ML & Parsing ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
md-5 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
extended-isolation-forest = "0.2"
chrono = "0.4"

# --- Native Active-Defense (thread suspend/resume, forensic memory dump) ---
# Compiled here (not interpreted C# text) so AMSI's script-content scan never sees
# these Win32 API references at all -- see src/native_defense.rs.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_System_Kernel",
    "Win32_System_Memory",
] }
sha2 = "0.10"
winreg = "0.52"