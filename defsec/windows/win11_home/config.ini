; =============================================================================
;  Windows 11 Home containment baseline - module selection config
; =============================================================================
;  Pass this file to the orchestrator:
;
;      powershell.exe -ExecutionPolicy Bypass -File .\Invoke-HomeBaseline.ps1 -Remediate -ConfigPath .\config.ini
;
;  How it works
;  ------------
;  * Each [Section] below is a module. "Enabled = true" wires it into the run;
;    "Enabled = false" skips it.
;  * Extra keys in a section are options passed to that module (documented per
;    section). Toggle keys take true/false; count/level keys take a number.
;  * Precedence: an explicit -Modules on the command line overrides the Enabled
;    flags here, but the per-module OPTIONS below still apply either way.
;  * Comments start with ';' or '#'. Edit freely - unknown keys are ignored.
;
;  Reboot after -Remediate: RunAsPPL (CredentialTheftGuard) and the NetBIOS node
;  type (NameResolutionGuard) only take effect at boot.
; =============================================================================


; -----------------------------------------------------------------------------
; GLOBAL RUN SETTINGS (reserved [Baseline] section - not a module)
; Drives the whole run from this file. Anything you pass on the command line still
; overrides the matching setting here. Safe-by-default: Remediate stays false so a
; bare "-ConfigPath config.ini" only assesses until you deliberately turn it on.
; -----------------------------------------------------------------------------
[Baseline]
; Remediate: true = APPLY changes; false = assess/dry-run only. Set true to have
; `Invoke-HomeBaseline.ps1 -ConfigPath config.ini` apply the baseline with no other flags.
Remediate = false
; Rollback: true = undo the enabled modules instead of applying (mutually exclusive
; with Remediate). Leave false for normal use.
Rollback = false
; SkipBackup: true = skip the pre-change .reg / firewall / Appx export before remediation.
SkipBackup = false
; NoReport: true = do NOT write the Markdown run report.
NoReport = false
; ReportPath: full path for the run report. Blank = auto-name in the working directory
; (HomeBaseline-Report-<host>-<timestamp>.md).
ReportPath =
; OutputPath: folder for pre-change backups. Blank = .\HomeReports\<host>-<timestamp>\.
OutputPath =
; Force: true = bypass the Windows 11 / elevation pre-flight checks.
Force = false


; -----------------------------------------------------------------------------
; DEFAULT-ON modules
; No collateral for a normal household (printer / external drive / NAS / games).
; -----------------------------------------------------------------------------

[ScriptHostGuard]
; Disables Windows Script Host engine-wide and makes .vbs/.js/.jse/.wsf/.hta
; files OPEN IN NOTEPAD on double-click instead of executing. This is the main
; defense against ClickFix "paste-and-run" lures and emailed script droppers.
; Turn OFF only if you legitimately run login scripts or .vbs/.js automation.
Enabled = true

[LolbinEgressGuard]
; Kernel-level (Windows Firewall / WFP) OUTBOUND-BLOCK rules for the signed
; Microsoft binaries attackers use as download cradles and C2 callbacks:
; mshta, wscript, cscript, certutil, certreq, bitsadmin, regsvr32. They still
; run locally; they just can't reach the internet to fetch a payload or beacon.
; Unaffected by user-mode ETW/AMSI tampering. Defender often does NOT catch this.
Enabled = true
; IncludeCurl: also block curl.exe egress. OFF by default because curl is a real
; tool for developers/support. Set true on non-developer machines.
IncludeCurl = true

[CredentialTheftGuard]
; Runs LSASS as a Protected Process Light (RunAsPPL=1) so even an elevated
; attacker cannot dump credentials (Mimikatz/comsvcs) to pivot. Effective after
; reboot. Rare downside: an unsigned smartcard/biometric/SSO plugin that injects
; into LSASS may break - if login fails after reboot, disable this one module.
Enabled = true

[NameResolutionGuard]
; Shuts down LLMNR, NetBIOS-broadcast name resolution (P-node), and WPAD
; auto-discovery - the protocols Responder-class tools poison on a LAN to harvest
; your NTLM credentials. DNS and mDNS are untouched, so printers/casting/NAS-by-
; name keep working. NetBIOS change needs a reboot.
Enabled = true

[RemoteServiceGuard]
; Stops and disables WinRM and Remote Registry - inbound remote-management
; channels a home machine never uses but attackers pivot through. Outbound
; remoting FROM this machine is unaffected. Leaves Print Spooler, file sharing,
; and Quick Assist alone. Turn OFF if you manage this PC via PowerShell remoting.
Enabled = true

[ExplorerVisibilityHardening]
; Forces Explorer to show file extensions, so "invoice.pdf.exe" is not disguised
; as "invoice.pdf". Restarts Explorer to apply.
Enabled = true

[PhishingAttachmentGuard]
; Forces downloaded files/email attachments to KEEP their Mark-of-the-Web and be
; AV-scanned + SmartScreen-checked (the registry replacement for AppLocker's
; "block execution from the browser/Outlook cache"). No file is blocked outright;
; a deliberate download still opens after the normal warning.
Enabled = true

[BrowserScamGuard]
; Blocks the browser notification-permission prompt behind most "your PC has a
; virus, call this number" popups, and raises Safe Browsing to Enhanced across
; Edge, Chrome, and Firefox. Hardens the scam path only - not general browsing.
Enabled = true

[BrowserHardening]
; Strong-but-balanced security policy across Edge/Chrome/Firefox: block dangerous
; downloads, disable the remote-debug port infostealers use to steal cookies, block
; programs silently installing extensions, block web pages probing your home router,
; TLS 1.2 floor, encrypted DNS, and (Edge) SmartScreen + Enhanced Security Mode.
; Keeps the password manager, DevTools, and http router pages working.
Enabled = true
; Strict: also block third-party cookies and prompt for every download location.
; Minor friction (some embedded logins, an extra save prompt). OFF by default.
Strict = true

[RemovableMediaGuard]
; Disables the AutoRun/AutoPlay PROMPT (the "found a USB - run setup.exe?" vector)
; for all drive types. Does NOT block storage: external drives, USB sticks, and
; SD cards still mount and their files are fully accessible.
Enabled = true

[UacHardening]
; The admin account is the #1 weakness on Home. Turns UAC up to always-prompt on the
; secure desktop and puts the built-in Administrator in Admin Approval Mode, so silent
; script-driven elevation on the initial vector dies. Near-zero friction (you already
; click "Yes"). Does NOT auto-demote your account - see the README for the safe manual
; standard-user step. EnableLUA changes need a reboot.
Enabled = true

[DiskImageMountGuard]
; Stops Windows auto-mounting .iso/.img/.vhd/.vhdx on double-click - the container trick
; that smuggles payloads past Mark-of-the-Web (files inside a mounted image get no
; "from the internet" warning). Mount-DiskImage from PowerShell still works. Near-zero
; collateral for a home user.
Enabled = true

[SmartScreenOsGuard]
; Turns OS SmartScreen up from "Warn" (click-through) to "Block" - a bad-reputation
; download/app is stopped with no "run anyway" button - and enables Defender PUA
; (adware/junk-cleaner/coin-miner) blocking. For a user who clicks past every warning,
; this is the difference between a warning and a wall.
Enabled = true

[UpdateAssurance]
; Pins automatic Windows/Office updates ON and clears update deferrals, so the machine
; isn't left exploitable through known holes that need no click. Essentially no friction.
Enabled = true

[Debloat]
; Removes retired/promotional preinstalled apps (Skype, Cortana, People, News,
; Solitaire, Clipchamp, consumer Teams, ...), stops Windows silently installing
; promoted third-party apps, disables the Widgets feed and advertising ID, and
; removes the deprecated WMIC LOTL binary. KEEPS Store, Phone Link, media apps,
; Weather, Calculator/Photos, Quick Assist. Removed apps reinstall from the Store.
Enabled = true
; IncludeXbox: also remove all Xbox apps/Game Bar. OFF by default (gaming is a
; first-class home use case). Set true on machines that never game.
IncludeXbox = true

[SmartAppControlAudit]
; STATUS ONLY - reports whether Smart App Control (Windows' built-in allowlisting,
; the real AppLocker substitute on Home) is On / Evaluation / Off, and your
; options. Cannot be enabled by script (only a Windows reset arms it). Harmless
; to leave on; makes no changes.
Enabled = true


; -----------------------------------------------------------------------------
; OPT-IN modules
; Real usability trade-offs - off by default. Read each note before enabling.
; -----------------------------------------------------------------------------

[RunDialogLockdown]
; Removes the Win+R Run dialog (a common ClickFix delivery path) for ALL users,
; including admins. Enable on normal-user machines; skip where an admin needs Run.
Enabled = true

[OfficeMacroGuard]
; Enables the Defender ASR rules that stop an Office macro from spawning processes
; or calling Win32 APIs (the "enable macros to view this document" chain).
; Requires Defender as the active AV. Can break legitimate macro automation.
Enabled = true

[RemoteAccessToolGuard]
; Blocks known remote-access/RMM tools by filename (AnyDesk, UltraViewer,
; TeamViewer QuickSupport, ScreenConnect, Atera, Splashtop, NetSupport) using
; Image File Execution Options. Aimed at tech-support scams. WARNING: several of
; these are the SANCTIONED tool for many IT departments/MSPs - confirm what you
; use before enabling, and edit the list in the .psm1 to remove your own tool.
Enabled = true

[NtlmEgressGuard]
; Denies ALL outgoing NTLM authentication (RestrictSendingNTLMTraffic=2), killing
; credential capture/relay. WARNING: NTLM-only NAS boxes, older printers/scanners,
; and some VPNs will stop authenticating. Audit first (see the module's help).
Enabled = true

[DnsFilterGuard]
; Points system DNS at a malware-filtering resolver with encrypted DNS, so known
; phishing/malware/C2 domains fail at the network layer before the browser or a LOLBin
; reaches them. WARNING: captive-portal Wi-Fi (hotels/airports) and some ISP/enterprise
; networks can misbehave with a pinned resolver. Roll back for travel if needed.
Enabled = true
; Provider: Quad9 (default) or Cloudflare - both malware-filtering, privacy-respecting.
Provider = Quad9

[RansomwareResilience]
; Turns on Defender Controlled Folder Access (blocks unknown processes from encrypting
; your Documents/Pictures) and ensures System Restore is on. WARNING: Controlled Folder
; Access has a false-positive tail - some games/creative/backup apps get blocked until
; you allow-list them in Windows Security. Use Mode=Audit first to shake those out.
Enabled = true
; Mode: Enabled (block) or Audit (log-only, recommended first). Requires Defender as the active AV.
Mode = Enabled

[OfficeHardening]
; Hardens desktop Microsoft Office beyond macros: blocks macros from the internet, kills
; the DDE auto-execute vector, pins Protected View on. Auto-skips if desktop Office isn't
; installed (the Office web apps need none of this). Does NOT disable trusted local macros.
Enabled = true
