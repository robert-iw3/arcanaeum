; remediate. Comment out a line (prefix with ; or #) to EXCLUDE that single
; control. Uncomment it to re-include it. This file is ignored when -StigId is
; passed on the command line, and can be skipped entirely with -IgnoreRulesFile.
;
; Format: VID = Title
;
; All controls below are ACTIVE by default - this baseline has no opt-in sections.

