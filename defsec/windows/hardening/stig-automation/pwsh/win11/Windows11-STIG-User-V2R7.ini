; Windows 11 STIG V2R7 - User (HKCU) rule selection
; ----------------------------------------------------------------------------
; Used by Windows11-STIG-User-V2R7.ps1 to decide which rules to evaluate/
; remediate, on top of -Section/-Severity. Comment out a line (prefix with ;
; or #) to EXCLUDE that single control. Uncomment it to re-include it.
; This file is ignored when -StigId is passed on the command line, and can be
; skipped entirely with -IgnoreRulesFile.
;
; Format: STIGID = Severity | Title
;
; Section UserConfig is ACTIVE by default - all three controls below apply.

[UserConfig]
WN11-CC-000390 = Low | No third-party suggestions in spotlight
WN11-UC-000015 = Low | No toast notifications on lock screen
WN11-UC-000020 = Medium | Preserve zone info on file attachments
