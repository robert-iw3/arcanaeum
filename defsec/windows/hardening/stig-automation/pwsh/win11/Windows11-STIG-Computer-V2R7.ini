; Windows 11 STIG V2R7 - Computer (HKLM) rule selection
; ----------------------------------------------------------------------------
; Used by Windows11-STIG-Computer-V2R7.ps1 to decide which rules to evaluate/
; remediate, on top of -Section/-Severity. Comment out a line (prefix with ;
; or #) to EXCLUDE that single control. Uncomment it to re-include it.
; This file is ignored when -StigId is passed on the command line, and can be
; skipped entirely with -IgnoreRulesFile.
;
; Format: STIGID = Severity | Title
;
; Sections AccountPolicy, UserRights, AuditPolicy, SecurityOptions, ComputerConfig, System are ACTIVE by default (laptop baseline).
; Sections Domain, DoD, Restrictive are opt-in and shipped fully commented out -
; uncomment individual lines (or pass -Section Domain/DoD/Restrictive) to use them.

